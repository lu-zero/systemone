[workspace]
members = ["systemone", "systemone-macro", "systemone-facet", "systemone-bench"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/lu-zero/systemone"

[workspace.dependencies]
systemone = { path = "systemone", version = "0.2.0" }
systemone-macro = { path = "systemone-macro", version = "0.2.0" }
systemone-facet = { path = "systemone-facet", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
tokio = { version = "1", features = ["time"] }
fastrand = "2"
test-case = "3"
