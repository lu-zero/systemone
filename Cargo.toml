[workspace]
members = ["systemone", "systemone-macro", "systemone-facet", "systemone-bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/lu-zero/systemone"

[workspace.dependencies]
systemone = { path = "systemone", version = "0.1.0" }
systemone-macro = { path = "systemone-macro", version = "0.1.0" }
systemone-facet = { path = "systemone-facet", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
isahc = { version = "1.7", default-features = false, features = ["text-decoding", "static-curl", "static-ssl", "http2"] }
async-io = "2"
fastrand = "2"
test-case = "3"
futures-lite = "2"
